/* spatial hash for separation */
const CELL=40,HB=2048,head=new Int32Array(HB);let nxt=new Int32Array(512);
const cellH=(cx,cy)=>((Math.imul(cx,73856093)^Math.imul(cy,19349663))&(HB-1));
function buildGrid(){
  head.fill(-1);if(nxt.length<enemies.length)nxt=new Int32Array(enemies.length*2);
  for(let i=0;i<enemies.length;i++){const e=enemies[i];const h=cellH(Math.floor(e.x/CELL),Math.floor(e.y/CELL));nxt[i]=head[h];head[h]=i;}
}
function separate(i,e){
  const cx=Math.floor(e.x/CELL),cy=Math.floor(e.y/CELL);
  for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
    let j=head[cellH(cx+ox,cy+oy)];
    while(j!==-1){
      if(j>i){
        const o=enemies[j];
        if(!o.dead){
          const dx=o.x-e.x,dy=o.y-e.y,m=(e.r+o.r)*0.85,d2=dx*dx+dy*dy;
          if(d2<m*m&&d2>0.01){
            const d=Math.sqrt(d2),p=(m-d)*0.5,ux=dx/d,uy=dy/d,tm=e.mass+o.mass,we=o.mass/tm,wo=e.mass/tm;
            e.x-=ux*p*2*we*0.5;e.y-=uy*p*2*we*0.5;o.x+=ux*p*2*wo*0.5;o.y+=uy*p*2*wo*0.5;
          }
        }
      }
      j=nxt[j];
    }
  }
}

/* ---------- update ---------- */
function readInput(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;
  if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;
  if(joy){const jx=joy.x-joy.sx,jy=joy.y-joy.sy,m=Math.hypot(jx,jy);if(m>8){const k=Math.min(1,m/54);x+=jx/m*k;y+=jy/m*k;}}
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}
  input.x=x;input.y=y;
}
function update(rdt){
  const dead=mode==='dead';
  if(slowT>0)slowT-=rdt;
  timeScale=dead?0.3:(slowT>0?0.35:1);
  const dt=rdt*timeScale;
  now+=dt;if(!dead)run.t+=dt;else deadT+=rdt;
  readInput();
  let moving=false;

  /* player */
  if(!dead){
    if(P.ch<P.chMax){P.cd-=dt;if(P.cd<=0){P.ch++;if(P.ch<P.chMax){P.cd=cdMax();P.cdFull=P.cd;}else P.cd=0;}}
    if(P.chMax<2&&run.t>=RUSH_T)unlockCharge(2);
    if(P.chMax<3&&run.t>=CH3_T)unlockCharge(3);
    P.pipT=Math.max(0,P.pipT-dt);rushFx=Math.max(0,rushFx-dt*0.9);
    P.dodgeInv=Math.max(0,P.dodgeInv-dt);P.hurtInv=Math.max(0,P.hurtInv-dt);
    if(P.da>=0){P.da+=dt;if(P.da>=DEND)P.da=-1;}
    const dfi=P.da>=0?dfIndex(P.da):0;
    if(P.dodgeT>0){
      const el=P.dodgeDur-P.dodgeT,f=1.8*(1-el/P.dodgeDur)+0.1,st=Math.min(dt,P.dodgeT);
      P.x+=P.dx*P.dodgeV*f*st;P.y+=P.dy*P.dodgeV*f*st;P.dodgeT-=dt;
      P.ghostT-=dt;
      if(P.ghostT<=0){P.ghostT=0.03;ghosts.push({x:P.x,y:P.y,flip:P.gside>0?-1:1,life:0.3,max:0.3,fi:dfi,kind:P.kind});}
      moving=true;
    }else{
      const sp=spd()*((P.da>=0&&P.da<0.54)?0.35:1);P.x+=input.x*sp*dt;P.y+=input.y*sp*dt;
      moving=Math.hypot(input.x,input.y)>0.1;
      if(Math.abs(input.x)>0.1)P.face=input.x>0?1:-1;
    }
    const tl=(P.dodgeT>0||P.da>=0)?0:(moving?0.05:0);
    P.lean+=(tl-P.lean)*Math.min(1,dt*18);
    P.run+=((moving?1:0)-P.run)*Math.min(1,dt*12);P.phase+=dt*(moving?16:0);
  }

  /* weapons */
  if(!dead){
    if(P.w.bone>0){
      P.boneT-=dt;
      if(P.boneT<=0){
        const L=P.w.bone,n=1+(L>>1),near=nearestN(n,480);
        if(!near.length)P.boneT=0.2;
        else{
          P.boneT=Math.max(0.4,1.15-0.07*L);
          for(let i=0;i<n;i++){
            const tg=near[i%near.length];let a=Math.atan2(tg.y-P.y,tg.x-P.x);if(i>=near.length)a+=rnd(-0.25,0.25);
            bones.push({x:P.x,y:P.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,rot:0,life:1.3,pierce:1+(L>=3?1:0)+(L>=6?1:0),dmg:(6+1.7*L)*dmgMul(),hit:[]});
          }
          sfx('shoot');
        }
      }
    }
    if(P.w.bark>0){
      P.barkT-=dt;
      if(P.barkT<=0){
        const L=P.w.bark;P.barkT=Math.max(1.0,2.5-0.2*L);
        rings.push({id:++uid,x:P.x,y:P.y,r:6,max:78+16*L,sp:320,dmg:(7+3*L)*dmgMul(),bul:L>=3,follow:true,col:'#bfeaff',perf:false});sfx('bark');
      }
    }
    P.orbPos.length=0;
    if(P.w.orbit>0){
      const L=P.w.orbit,n=1+(L>>1),R=64+4*L;
      P.orbAng+=dt*(3+0.15*L);
      for(let i=0;i<n;i++){
        const a=P.orbAng+i*TAU/n,bx=P.x+Math.cos(a)*R,by=P.y+Math.sin(a)*R;P.orbPos.push({x:bx,y:by});
        for(const e of enemies){
          if(e.dead||now<e.orbT)continue;
          const dx=e.x-bx,dy=e.y-by,rr=e.r+10;
          if(dx*dx+dy*dy<rr*rr){e.orbT=now+0.35;const d=Math.hypot(dx,dy)||1;dmgE(e,(4+1.5*L)*dmgMul(),dx/d*170,dy/d*170);}
        }
      }
    }
    if(P.w.puddle>0){
      P.puddleT-=dt;
      if(P.puddleT<=0&&moving){const L=P.w.puddle;P.puddleT=Math.max(0.25,0.55-0.03*L);puddles.push({x:P.x,y:P.y+8,r:22+3*L,life:2.2+0.4*L,max:2.2+0.4*L,tick:0,L});}
    }
  }

  /* spawn + enemies */
  if(!dead)spawnLogic(dt);
  buildGrid();
  const sd=viewR()+50;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];if(e.dead)continue;
    if(e.flash>0)e.flash-=dt;if(e.slow>0)e.slow-=dt;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;let nx=dx/d,ny=dy/d;
    if(e.big){updateBoss(e,dt,d,nx,ny,dead);}
    else{
      let sp=e.sp*(e.slow>0?0.55:1);
      if(e.shoot){
        const want=e.type==='owl'?320:250;
        if(d<want-50){nx=-nx;ny=-ny;}else if(d<want+30){const tx=nx;nx=-ny*e.dir;ny=tx*e.dir;sp*=0.7;}
        e.shootT-=dt;
        if(e.shootT<=0&&d<520&&!dead){
          const a=Math.atan2(dy,dx),bs=1+run.t/700;
          if(e.shoot==='fan'){e.shootT=2.8;for(let k=-1;k<=1;k++)fireBullet(e.x,e.y,a+k*0.24,150*bs);}
          else{e.shootT=3.6;const o=rnd(0,TAU);for(let k=0;k<12;k++)fireBullet(e.x,e.y,o+k/12*TAU,105*bs);}
        }
      }
      e.x+=(nx*sp+e.vx)*dt;e.y+=(ny*sp+e.vy)*dt;
      e.face=nx>=0?1:-1;
      if(d>sd+260){const[x,y]=spawnRing();e.x=x;e.y=y;}
    }
    const kd=Math.exp(-8*dt);e.vx*=kd;e.vy*=kd;
    separate(i,e);
    if(!dead&&d<e.r+P.r){
      if(e.big)hurt(e.state==='dash'?26:14);else hurt(e.dmg);
    }
  }
  /* bark/perfect rings */
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.r+=r.sp*dt;if(r.follow){r.x=P.x;r.y=P.y;}
    if(r.dmg>0){
      for(const e of enemies){
        if(e.dead||e.rid===r.id)continue;
        const dx=e.x-r.x,dy=e.y-r.y;
        if(dx*dx+dy*dy<=(r.r+e.r)*(r.r+e.r)){e.rid=r.id;const d=Math.hypot(dx,dy)||1;dmgE(e,r.dmg,dx/d*260,dy/d*260);}
      }
    }
    if(r.bul){
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j],dx=b.x-r.x,dy=b.y-r.y;
        if(dx*dx+dy*dy<(r.r+4)*(r.r+4)){addP(b.x,b.y,0,0,0.2,6,'#fff','dot');bullets[j]=bullets[bullets.length-1];bullets.pop();}
      }
    }
    if(r.r>=r.max){rings[i]=rings[rings.length-1];rings.pop();}
  }
  /* bones */
  for(let i=bones.length-1;i>=0;i--){
    const b=bones[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=dt*14;b.life-=dt;
    let rm=b.life<=0;
    if(!rm){
      for(const e of enemies){
        if(e.dead)continue;const dx=e.x-b.x,dy=e.y-b.y,rr=e.r+8;
        if(dx*dx+dy*dy<rr*rr&&b.hit.indexOf(e)<0){
          b.hit.push(e);const d=Math.hypot(b.vx,b.vy)||1;dmgE(e,b.dmg,b.vx/d*140,b.vy/d*140);
          b.pierce--;if(b.pierce<0){rm=true;break;}
        }
      }
    }
    if(rm){bones[i]=bones[bones.length-1];bones.pop();}
  }
  /* puddles */
  for(let i=puddles.length-1;i>=0;i--){
    const p=puddles[i];p.life-=dt;p.tick-=dt;
    const doTick=p.tick<=0;if(doTick)p.tick=0.4;
    for(const e of enemies){
      if(e.dead)continue;const dx=e.x-p.x,dy=e.y-p.y,rr=p.r+e.r*0.6;
      if(dx*dx+dy*dy<rr*rr){e.slow=0.25;if(doTick)dmgE(e,(3+1.4*p.L)*dmgMul(),0,0);}
    }
    if(p.life<=0){puddles[i]=puddles[puddles.length-1];puddles.pop();}
  }
  /* enemy bullets */
  {
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      if(b.life<=0||Math.abs(b.x-P.x)>900||Math.abs(b.y-P.y)>900){bullets[i]=bullets[bullets.length-1];bullets.pop();continue;}
      if(!dead){
        const dx=b.x-P.x,dy=b.y-P.y,d2=dx*dx+dy*dy,rr=P.r+b.r;
        if(d2<rr*rr){
          if(P.dodgeInv>0)perfectDodge();
          else if(P.hurtInv<=0){hurt(b.dmg);bullets[i]=bullets[bullets.length-1];bullets.pop();continue;}
        }else if(!b.gz&&d2<(rr+13)*(rr+13)&&P.dodgeInv<=0){
          b.gz=true;addP(b.x,b.y,rnd(-40,40),rnd(-40,40),0.25,2.5,'#fff','dot');addXP(0.25);
        }
      }
    }
  }
  /* gems + pickups */
  const mr=magnetR();
  for(let i=gems.length-1;i>=0;i--){
    const q=gems[i];
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.exp(-5*dt);q.vy*=Math.exp(-5*dt);
    if(dead)continue;
    const dx=P.x-q.x,dy=P.y-q.y,d=Math.hypot(dx,dy)||1;
    if(d<mr||q.att){q.att=true;const s=320+(q.s||0);q.s=(q.s||0)+dt*500;q.x+=dx/d*s*dt;q.y+=dy/d*s*dt;}
    if(d<P.r+8){addXP(q.v);sfx('gem');gems[i]=gems[gems.length-1];gems.pop();}
  }
  for(let i=pickups.length-1;i>=0;i--){
    const q=pickups[i];if(dead)break;
    const dx=P.x-q.x,dy=P.y-q.y,d=Math.hypot(dx,dy)||1;
    if(d<mr*0.5){q.x+=dx/d*240*dt;q.y+=dy/d*240*dt;}
    if(d<P.r+14){
      if(q.kind==='meat'){P.hp=Math.min(P.maxHp,P.hp+Math.max(15,P.maxHp*0.2));sfx('meat');burst(q.x,q.y,10,'#ff9aa8',160,3.5,0.5);}
      else{pendingLv++;burst(q.x,q.y,26,'#ffd34d',260,5,0.7);sfx('level');if(mode==='play')openLevelUp();}
      pickups[i]=pickups[pickups.length-1];pickups.pop();
    }
  }
  /* ghosts / particles / texts */
  for(let i=ghosts.length-1;i>=0;i--){ghosts[i].life-=dt;if(ghosts[i].life<=0){ghosts[i]=ghosts[ghosts.length-1];ghosts.pop();}}
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;if(p.life<=0){parts[i]=parts[parts.length-1];parts.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='dot'){p.vx*=Math.exp(-3*dt);p.vy*=Math.exp(-3*dt);}
  }
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;t.y+=t.vy*dt;if(t.life<=0){texts[i]=texts[texts.length-1];texts.pop();}}
  /* compact enemies */
  let w=0;for(let i=0;i<enemies.length;i++){if(!enemies[i].dead)enemies[w++]=enemies[i];}enemies.length=w;
  /* camera + fx */
  cam.x+=(P.x-cam.x)*Math.min(1,rdt*9);cam.y+=(P.y-cam.y)*Math.min(1,rdt*9);
  shake=Math.max(0,shake-34*rdt);hurtFlash=Math.max(0,hurtFlash-rdt);
  if(dead&&deadT>1.9)toPick();
}
function updateBoss(e,dt,d,nx,ny,dead){
  e.rot+=dt*(e.state==='dash'?14:2);
  if(dead)return;
  if(e.state==='chase'){
    e.x+=(nx*e.sp+e.vx)*dt;e.y+=(ny*e.sp+e.vy)*dt;e.stT-=dt;
    if(e.stT<=0){e.state='wind';e.stT=0.95;}
  }else if(e.state==='wind'){
    e.stT-=dt;if(e.stT>0.28){e.bx=nx;e.by=ny;}
    if(e.stT<=0){e.state='dash';e.stT=0.55;}
  }else{
    e.x+=e.bx*560*dt;e.y+=e.by*560*dt;e.stT-=dt;
    if(e.stT<=0){e.state='chase';e.stT=rnd(2.8,3.8);}
  }
  e.face=nx>=0?1:-1;
  if(e.state!=='dash'){
    e.bT-=dt;
    if(e.bT<=0){e.bT=0.15;e.ang+=0.46;fireBullet(e.x,e.y,e.ang,135);fireBullet(e.x,e.y,e.ang+Math.PI,135);}
  }
  e.ringT-=dt;
  if(e.ringT<=0){e.ringT=6;const o=rnd(0,TAU);for(let k=0;k<22;k++)fireBullet(e.x,e.y,o+k/22*TAU,115);shake=Math.max(shake,5);}
}

    if(q.kind==='meat'){icon(g,'meat',q.x,q.y+b,26);}
    else{
      g.fillStyle='rgba(255,211,77,.25)';g.beginPath();g.arc(q.x,q.y+b,24+Math.sin(anim*6)*3,0,TAU);g.fill();
      g.fillStyle='#9a5b2a';g.fillRect(q.x-13,q.y-8+b,26,18);g.fillStyle='#c4803c';g.fillRect(q.x-13,q.y-12+b,26,8);
      g.fillStyle='#ffd34d';g.fillRect(q.x-3,q.y-6+b,6,8);g.fillRect(q.x-13,q.y-5+b,26,2.4);
    }
  }
  /* boss telegraph handled in drawBoss. rings */
  for(const r of rings){
    const k=1-r.r/r.max;
    g.globalAlpha=Math.max(0,k)*(r.perf?0.95:0.8);
    g.strokeStyle=r.col;g.lineWidth=(r.perf?5:9)*Math.max(0.25,k);
    g.beginPath();g.arc(r.x,r.y,r.r,0,TAU);g.stroke();
    if(!r.perf){g.lineWidth=2;g.strokeStyle='#fff';g.beginPath();g.arc(r.x,r.y,r.r*0.86,0,TAU);g.stroke();}
    g.globalAlpha=1;
  }
  /* ghosts */
  for(const gh of ghosts){
    const sl=ghostSil[gh.kind][gh.fi]||(ghostSil[gh.kind][gh.fi]=sil(getDogFrame(gh.kind,DFRAMES[gh.fi]),DOGC[gh.kind].acc));
    g.save();g.translate(gh.x,gh.y+34);g.scale(gh.flip,1);g.globalAlpha=0.5*gh.life/gh.max;
    g.drawImage(sl.c,-FOX*DK,-FOY*DK,FW*DK,FH*DK);g.restore();
  }
  /* enemies behind player, player, enemies in front */
  if(P){
    for(const e of enemies)if(e.y<=P.y)drawEnemy(e);
    drawPlayer();
    for(const e of enemies)if(e.y>P.y)drawEnemy(e);
  }
  /* orbit balls */
  if(P){
    for(const o of P.orbPos){
      g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(o.x,o.y+12,8,3,0,0,TAU);g.fill();
      g.fillStyle='#d8f04a';g.beginPath();g.arc(o.x,o.y,9,0,TAU);g.fill();
      g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(o.x-9*0.55,o.y,7.5,-0.9,0.9);g.stroke();g.beginPath();g.arc(o.x+9*0.55,o.y,7.5,Math.PI-0.9,Math.PI+0.9);g.stroke();
    }
  }
  for(const b of bones){g.save();g.translate(b.x,b.y);g.rotate(b.rot);icon(g,'bone',0,0,26,true);g.restore();}
  /* bullets */
  for(const b of bullets){
    if(b.x<vx0||b.x>vx1||b.y<vy0||b.y>vy1)continue;
    g.fillStyle='rgba(255,79,123,.34)';g.beginPath();g.arc(b.x,b.y,b.r+3.5,0,TAU);g.fill();
    g.fillStyle='#ff4f7b';g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill();
    g.fillStyle='#fff3d6';g.beginPath();g.arc(b.x,b.y,b.r*0.45,0,TAU);g.fill();
  }
  /* particles */
  for(const p of parts){
    const k=p.life/p.max;
    if(p.type==='line'){
      g.globalAlpha=k*0.8;g.strokeStyle=p.col;g.lineWidth=2.2;const m=Math.hypot(p.vx,p.vy)||1;
      g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx/m*p.size,p.y-p.vy/m*p.size);g.stroke();
    }else{
      g.globalAlpha=k;g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,Math.max(0.5,p.size*(0.4+0.6*k)),0,TAU);g.fill();
    }
  }
  g.globalAlpha=1;
  /* floating numbers */
  g.font='bold 12px '+FONT;g.textAlign='center';g.textBaseline='middle';
  for(const t of texts){g.globalAlpha=Math.min(1,t.life*3);g.lineWidth=3;g.strokeStyle='rgba(8,20,15,.85)';g.strokeText(t.t,t.x,t.y);g.fillStyle='#fff';g.fillText(t.t,t.x,t.y);}
  g.globalAlpha=1;
}
function drawHUD(){
  setScreen();
  /* xp bar */
  const bt=ins.t;
  g.fillStyle='rgba(8,20,15,.55)';g.fillRect(0,bt,W,7);
  g.fillStyle='#7be0ff';g.fillRect(0,bt,W*Math.min(1,P.xp/P.xpNext),7);
  /* hp */
  const hx=ins.l,hy=bt+18,hw=Math.min(190,W*0.42);
  icon(g,'heart',hx+11,hy+9,22);
  g.fillStyle='rgba(8,20,15,.6)';rr(hx+26,hy,hw,18,9);g.fill();
  const hp=clamp(P.hp/P.maxHp,0,1);
  g.fillStyle=hp>0.3?'#ff5a74':'#ff2d4a';rr(hx+26,hy,Math.max(10,hw*hp),18,9);g.fill();
  txt(Math.ceil(Math.max(0,P.hp))+'/'+P.maxHp,hx+26+hw/2,hy+9.5,12,'center');
  icon(g,'star',hx+11,hy+36,20);txt(String(P.lvl),hx+26,hy+36,16,'left','#ffd34d');
  /* timer */
  txt(fmt(run.t),W/2,bt+30,28,'center');
  /* kills */
  icon(g,'skull',W-ins.r-12,bt+30,24);txt(String(run.kills),W-ins.r-28,bt+31,20,'right');
  /* boss bar */
  if(boss){
    const bw=Math.min(320,W-ins.l-ins.r-20),bx=W/2-bw/2,by=bt+54;
    g.fillStyle='rgba(8,20,15,.65)';rr(bx,by,bw,10,5);g.fill();
    g.fillStyle='#ff4f7b';rr(bx,by,Math.max(8,bw*clamp(boss.hp/boss.maxhp,0,1)),10,5);g.fill();
  }
  /* items */
  const items=[];for(const k in ITEMS){const l=lvlOf(k);if(l>0)items.push(k);}
  const ws=items.filter(k=>ITEMS[k].cat==='w'),ps=items.filter(k=>ITEMS[k].cat==='p');
  const slot=(k,x,y)=>{
    g.fillStyle='rgba(8,20,15,.6)';rr(x,y,34,34,9);g.fill();
    g.strokeStyle=ITEMS[k].cat==='w'?'#ffb347':'#7fd0ff';g.lineWidth=2;rr(x,y,34,34,9);g.stroke();
    icon(g,k,x+17,y+17,24);
    txt(String(lvlOf(k)),x+31,y+30,12,'right','#fff');
  };
  const by0=H-ins.b-16-34;
  ws.forEach((k,i)=>slot(k,ins.l+i*38,by0));
  ps.forEach((k,i)=>slot(k,ins.l+i*38,by0-40));
  /* dodge button */
  const b=dodgeBtn(),ready=P.ch>0,pr=P.ch>=P.chMax?1:1-(P.cdFull>0?clamp(P.cd/P.cdFull,0,1):0);
  g.fillStyle='rgba(8,20,15,.55)';g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill();
  const ac=DOGC[P.kind].acc;
  g.lineWidth=6;g.strokeStyle='rgba(255,255,255,.14)';g.beginPath();g.arc(b.x,b.y,b.r-3,0,TAU);g.stroke();
  g.strokeStyle=ready?ac:'rgba(255,255,255,.55)';g.beginPath();g.arc(b.x,b.y,b.r-3,-Math.PI/2,-Math.PI/2+TAU*pr);g.stroke();
  if(ready){g.globalAlpha=0.25+0.2*Math.sin(anim*6);g.fillStyle=ac;g.beginPath();g.arc(b.x,b.y,b.r-8,0,TAU);g.fill();g.globalAlpha=1;}
  g.globalAlpha=ready?1:0.5;icon(g,'dodge',b.x,b.y,38);g.globalAlpha=1;
  for(let i=0;i<P.chMax;i++){
    const px=b.x+(i-(P.chMax-1)/2)*20,py=b.y-b.r-14,on=i<P.ch,pop=(i===P.chMax-1&&P.pipT>0)?1+P.pipT*0.9:1;
    g.fillStyle='rgba(8,20,15,.65)';g.beginPath();g.arc(px,py,8*pop,0,TAU);g.fill();
    g.fillStyle=on?ac:'rgba(255,255,255,.2)';g.beginPath();g.arc(px,py,5.2*pop,0,TAU);g.fill();
    if(on){g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(px-1.4,py-1.6,1.6,0,TAU);g.fill();}
  }
  /* joystick */
  if(joy){
    let jx=joy.x-joy.sx,jy=joy.y-joy.sy;const m=Math.hypot(jx,jy);if(m>54){jx=jx/m*54;jy=jy/m*54;}
    g.fillStyle='rgba(255,243,214,.1)';g.beginPath();g.arc(joy.sx,joy.sy,54,0,TAU);g.fill();
    g.strokeStyle='rgba(255,243,214,.35)';g.lineWidth=2;g.stroke();
    g.fillStyle='rgba(255,243,214,.5)';g.beginPath();g.arc(joy.sx+jx,joy.sy+jy,22,0,TAU);g.fill();
  }
}
function drawPick(){
  cam.x=anim*16;cam.y=Math.sin(anim*0.2)*60;camSX=0;camSY=0;
  drawGround();setScreen();
  g.fillStyle='rgba(8,20,15,.4)';g.fillRect(0,0,W,H);
  const k=clamp(Math.min(H*0.46/140,(W/2-22)/76),1.0,3.4),feetY=H*0.64;
  for(let i=0;i<2;i++){
    const kind=i?'black':'gold',col=DOGC[kind].acc,cx=W*(i?0.73:0.27),hv=hover===i;
    const R=k*46,hop=hv?-Math.abs(Math.sin(anim*8))*5:0;
    const gr=g.createRadialGradient(cx,feetY-k*50,4,cx,feetY-k*50,R*1.9);
    gr.addColorStop(0,col+(hv?'88':'55'));gr.addColorStop(1,col+'00');
    g.fillStyle=gr;g.beginPath();g.arc(cx,feetY-k*50,R*1.9,0,TAU);g.fill();
    g.strokeStyle=col;g.globalAlpha=0.35+0.3*Math.sin(anim*4+i);g.lineWidth=3;
    g.beginPath();g.ellipse(cx,feetY,R*0.9,R*0.26,0,0,TAU);g.stroke();g.globalAlpha=1;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(cx,feetY,R*0.6,R*0.14,0,0,TAU);g.fill();
    const pose=hv?((Math.floor(anim*6)%2)?'walkA':'walkB'):'idle',fr=getDogFrame(kind,pose);
    const sc=k*(hv?1.06:1),br=1+0.012*Math.sin(anim*2.6+i);
    g.save();g.translate(cx,feetY+hop);g.scale(sc,sc*br);g.drawImage(fr.c,-FOX,-FOY,FW,FH);g.restore();
    const ic=i?['bark','heart','power']:['bone','speed','dodge'],iy=feetY+34;
    g.fillStyle='rgba(8,20,15,.6)';rr(cx-62,iy-20,124,40,20);g.fill();
    ic.forEach((id,j)=>icon(g,id,cx-38+j*38,iy,26));
    const py=iy+44;g.fillStyle=col;rr(cx-34,py-16,68,32,16);g.fill();icon(g,'play',cx,py,22);
  }
  if(lastRun){
    const y=ins.t+34,x=W/2;
    icon(g,'clock',x-96,y,24);txt(fmt(lastRun.t),x-80,y+1,22,'left');
    icon(g,'skull',x+6,y,24);txt(String(lastRun.kills),x+22,y+1,22,'left');
    icon(g,'star',x+84,y,22);txt(String(lastRun.lvl),x+98,y+1,22,'left','#ffd34d');
  }
  g.fillStyle=vig;g.fillRect(0,0,W,H);
}
function render(){
  setScreen();g.clearRect(0,0,W,H);
  if(mode==='pick'||!P){drawPick();return;}
  drawWorld();
  setScreen();
  g.fillStyle=vig;g.fillRect(0,0,W,H);
  if(hurtFlash>0){g.fillStyle=`rgba(255,40,70,${hurtFlash*0.5})`;g.fillRect(0,0,W,H);}
  if(rushFx>0){g.fillStyle=`rgba(255,211,106,${rushFx*0.3})`;g.fillRect(0,0,W,H);}
  if(slowT>0){g.fillStyle=`rgba(180,190,255,${Math.min(0.2,slowT*0.35)})`;g.fillRect(0,0,W,H);}
  if(mode==='dead'){g.fillStyle=`rgba(10,10,20,${Math.min(0.7,deadT*0.5)})`;g.fillRect(0,0,W,H);}
  drawHUD();
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const rdt=Math.min(0.033,(ts-last)/1000||0.016);last=ts;anim+=rdt;
  if(mode==='play'||mode==='dead')update(rdt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- input ---------- */
const GAMEKEYS=['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
addEventListener('keydown',e=>{
  unlock();
  if(GAMEKEYS.indexOf(e.code)>=0)e.preventDefault();
  keys[e.code]=true;
  if(e.repeat)return;
  if(mode==='pick'){
    if(e.code==='KeyA'||e.code==='ArrowLeft'||e.code==='Digit1')choose('gold');
    else if(e.code==='KeyD'||e.code==='ArrowRight'||e.code==='Digit2')choose('black');
  }else if(mode==='play'){
    if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyJ'||e.code==='KeyK')dodge();
  }else if(mode==='levelup'){
    const i=e.code==='Digit1'?0:e.code==='Digit2'?1:e.code==='Digit3'?2:-1;
    const btn=lv.children[i];if(btn)btn.click();
  }
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy=null;});
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{
  unlock();const p=pt(e);
  if(mode==='pick'){choose(p.x<W/2?'gold':'black');return;}
  if(mode!=='play')return;
  const b=dodgeBtn();
  if(Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.35){dodge();return;}
  if(!joy){joy={id:e.pointerId,sx:p.x,sy:p.y,x:p.x,y:p.y};try{cv.setPointerCapture(e.pointerId);}catch(err){}}
});
cv.addEventListener('pointermove',e=>{
  const p=pt(e);
  if(mode==='pick')hover=p.x<W/2?0:1;
  if(joy&&e.pointerId===joy.id){joy.x=p.x;joy.y=p.y;}
});
const endPtr=e=>{if(joy&&e.pointerId===joy.id)joy=null;};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{if(mode==='pick')hover=-1;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>

</body></html>
